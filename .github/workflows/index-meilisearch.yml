name: Index Meilisearch Data

on:
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read

jobs:
  index-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Meilisearch indexing script
        run: node scripts/index_meilisearch.cjs
        env:
          MEILISEARCH_HOST: 'https://search.bettergov.ph' # Or your Meilisearch host
          MEILISEARCH_MASTER_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}
